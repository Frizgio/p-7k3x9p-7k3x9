<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Persone">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<title>Chi vedo e quando</title>
<style>
:root{--bg:#f6f6f3;--card:#fff;--tx:#1b1b1a;--mut:#74746f;--ok:#1f9d55;--okbg:#e6f5ec;--bad:#d62f2f;--badbg:#fdeaea;--ln:#e3e3de;--ac:#2a5bd7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--card:#201f1e;--tx:#f0efea;--mut:#9a9993;--ok:#4cc27f;--okbg:#17291f;--bad:#ff6b6b;--badbg:#321a1a;--ln:#33322f;--ac:#7aa2ff}}
:root[data-theme="dark"]{--bg:#141413;--card:#201f1e;--tx:#f0efea;--mut:#9a9993;--ok:#4cc27f;--okbg:#17291f;--bad:#ff6b6b;--badbg:#321a1a;--ln:#33322f;--ac:#7aa2ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:560px;margin:0 auto;padding:14px 12px 48px}
header{text-align:center;padding:12px 0 20px}
header small{color:var(--mut);letter-spacing:.08em;text-transform:uppercase;font-size:12px}
header h1{margin:2px 0 0;font-size:56px;line-height:1;font-weight:700}
header span{color:var(--mut);font-size:14px}
.row{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--ln);border-left:5px solid var(--ok);border-radius:10px;padding:6px 10px;margin-bottom:5px;cursor:pointer}
.row.late{border-left-color:var(--bad);background:var(--badbg)}
.row.plan{border-left-color:#e8820c;background:rgba(232,130,12,.12)}
.pos{min-width:20px;text-align:right;color:var(--mut);font-size:13px}
.min{min-width:26px;text-align:center;font-weight:700;color:var(--mut);border:1px solid var(--ln);border-radius:8px;font-size:13px;padding:1px 4px}
.name{flex:1;font-weight:600;font-size:16px;line-height:1.2;overflow-wrap:anywhere}
.name small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.row.late .name small{color:var(--bad)}
.row.plan .name small{color:#e8820c}
.wk{font-weight:700;font-size:17px;min-width:28px;text-align:right}
.row.ok .wk{color:var(--ok)}
.row.late .wk{color:var(--bad)}
.row.plan .wk{color:#e8820c}
.flag{display:inline-flex}
.flag.red{color:var(--bad)}
.flag.orange{color:#e8820c}
.flag.green{color:var(--ok)}
.row .flag svg{width:17px;height:17px}
button{font:inherit;touch-action:manipulation;cursor:pointer;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--tx);padding:8px 12px}
.seen{min-width:38px;min-height:34px;padding:3px 9px;color:var(--ok);border-color:var(--ok);font-weight:700}
.planb{min-width:38px;min-height:34px;padding:3px 7px}
.primary{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.danger{color:var(--bad);border-color:var(--bad)}
.add{width:100%;margin-top:8px;padding:12px;border-style:dashed;color:var(--ac)}
#sheet{display:none;background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-top:12px}
#sheet label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
#sheet input{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx)}
.btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.empty,.note{color:var(--mut);text-align:center;font-size:14px;padding:12px}
.legend{display:flex;justify-content:center;gap:16px;color:var(--mut);font-size:13px;margin-bottom:12px;flex-wrap:wrap}
.legend>span{display:inline-flex;align-items:center;gap:4px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;padding:7px 12px;border-radius:999px}
.tab.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.tab i{font-style:normal;font-size:12px;margin-left:6px;background:var(--bad);color:#fff;border-radius:999px;padding:1px 6px}
.ask{background:var(--card);border:1px solid #e8820c;border-radius:12px;padding:12px;margin-bottom:10px}
.ask .q{font-weight:600;margin-bottom:8px}
.ask .btns{margin-top:0}
.sub{margin:10px 2px 4px;color:var(--mut);font-size:12px;font-weight:700}
.total{margin:8px 2px 0;padding:8px 10px;border-top:1px solid var(--ln);color:var(--mut);font-size:14px;font-weight:600;text-align:center}
.alert{background:var(--badbg);border:1px solid var(--bad);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.alert .q{font-weight:600;margin-bottom:6px;color:var(--bad)}
.alert .btns{margin-top:0}
</style>
</head>
<body>
<main>
<header><small>Settimana</small><h1 id="wk">–</h1><span id="yr"></span></header>
<div class="legend" id="legend"></div>
<div id="alerts"></div><div id="confirm"></div>
<div class="tabs" id="tabs"></div>
<div id="list"></div><div class="total" id="total"></div>
<button class="add" id="addBtn">+ Aggiungi persona</button>
<div id="sheet">
  <label for="fName">Nome</label><input id="fName" type="text" autocomplete="off">
  <label for="fMin">Vederla almeno ogni (settimane)</label><input id="fMin" type="number" min="1" max="52" inputmode="numeric">
  <label for="fWeek">Ultima settimana in cui l’ho vista</label><input id="fWeek" type="number" min="1" max="53" inputmode="numeric">
  <label for="fGroup">Gruppo</label><input id="fGroup" type="text" list="groups" autocomplete="off" placeholder="es. Ogni 2 settimane"><datalist id="groups"></datalist>
  <label for="fPlan">Incontro programmato: settimana (facoltativo)</label><input id="fPlan" type="number" min="1" max="53" inputmode="numeric">
  <div class="btns"><button class="primary" id="saveBtn">Salva</button><button id="cancelBtn">Annulla</button><button class="danger" id="delBtn">Elimina</button></div>
</div>
<div class="note" id="status"></div>
<div class="btns" style="justify-content:center"><button id="expBtn">Esporta backup</button><button id="impBtn">Importa backup</button><input id="impFile" type="file" accept=".json,application/json" style="display:none"></div>
<div class="note" id="msg"></div>
</main>
<script>
(function(){
var DAY=864e5, EPOCH=Date.UTC(2000,0,3), people=[], editing=null, store=null, curTab="*";
var FLAG='<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 3v18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M7 4h11l-3 4.5L18 13H7z" fill="currentColor"/></svg>';
var $=function(id){return document.getElementById(id)};

function nowAbs(){var d=new Date(),t=Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()),dow=(new Date(t).getUTCDay()+6)%7;return Math.floor((t-dow*DAY-EPOCH)/(7*DAY))}
function isoOf(abs){var thu=new Date(EPOCH+abs*7*DAY+3*DAY),y=thu.getUTCFullYear(),w=Math.floor((thu.getTime()-Date.UTC(y,0,1))/DAY/7)+1;return{w:w,y:y}}
function absOf(w,y){var j4=Date.UTC(y,0,4),dow=(new Date(j4).getUTCDay()+6)%7;return Math.round((j4-dow*DAY+(w-1)*7*DAY-EPOCH)/(7*DAY))}
function absFromWeekInput(w){var c=isoOf(nowAbs());return absOf(w,w>c.w?c.y-1:c.y)}
function absFromPlanInput(w){var c=isoOf(nowAbs());return absOf(w,w<c.w?c.y+1:c.y)}
function gname(p){return p.group||"Senza gruppo"}
function cp(p,o){var r={id:p.id,name:p.name,min:p.min,last:p.last,group:p.group||"",planned:p.planned||0,ack:p.ack||0};for(var k in o)r[k]=o[k];return r}
function status(p,n){if(p.planned&&p.planned>=n)return"plan";return(n-p.last)>p.min?"late":"ok"}

function renderAlerts(n){
  var box=$("alerts");box.textContent="";
  people.filter(function(p){return status(p,n)==="late"&&p.ack!==p.last}).forEach(function(p){
    var d=document.createElement("div");d.className="alert";
    var q=document.createElement("div");q.className="q";
    q.textContent="Da vedere: "+p.name+" — sono passate "+(n-p.last)+" settimane (minimo "+p.min+")";
    var b=document.createElement("div");b.className="btns";
    var pl=document.createElement("button");pl.className="primary";pl.textContent="Programma per la prossima settimana";
    pl.onclick=function(){save(cp(p,{planned:n+1}))};
    var ok=document.createElement("button");ok.textContent="Ok";
    ok.onclick=function(){save(cp(p,{ack:p.last}))};
    b.appendChild(pl);b.appendChild(ok);d.appendChild(q);d.appendChild(b);box.appendChild(d);
  });
}
function renderConfirm(n){
  var box=$("confirm");box.textContent="";
  people.filter(function(p){return p.planned&&p.planned<n}).forEach(function(p){
    var d=document.createElement("div");d.className="ask";
    var q=document.createElement("div");q.className="q";q.textContent="Settimana "+isoOf(p.planned).w+": ti sei visto con "+p.name+"?";
    var b=document.createElement("div");b.className="btns";
    var y=document.createElement("button");y.className="primary";y.textContent="Sì, visto";
    y.onclick=function(){save(cp(p,{last:Math.max(p.last,p.planned),planned:0}))};
    var no=document.createElement("button");no.textContent="No";
    no.onclick=function(){save(cp(p,{planned:0}))};
    b.appendChild(y);b.appendChild(no);d.appendChild(q);d.appendChild(b);box.appendChild(d);
  });
}

function renderTabs(n,names){
  var t=$("tabs");t.textContent="";
  if(!names.length)return;
  function mk(label,key){
    var b=document.createElement("button");b.className="tab"+(curTab===key?" on":"");b.textContent=label;
    var late=people.filter(function(p){return(key==="*"||gname(p)===key)&&status(p,n)==="late"}).length;
    if(late){var i=document.createElement("i");i.textContent=late;b.appendChild(i)}
    b.onclick=function(){curTab=key;render()};t.appendChild(b);
  }
  mk("Tutti","*");names.forEach(function(g){mk(g,g)});
}

function render(){
  var n=nowAbs(),c=isoOf(n);
  $("wk").textContent=c.w;var mo=EPOCH+n*7*DAY;function fd(t){var d=new Date(t);return("0"+d.getUTCDate()).slice(-2)+"/"+("0"+(d.getUTCMonth()+1)).slice(-2)+"/"+d.getUTCFullYear()}$("yr").textContent=fd(mo)+" - "+fd(mo+6*DAY);
  renderAlerts(n);renderConfirm(n);
  var names=[];people.forEach(function(p){if(names.indexOf(gname(p))<0)names.push(gname(p))});names.sort();
  if(curTab!=="*"&&names.indexOf(curTab)<0)curTab="*";
  var dl=$("groups");dl.textContent="";names.forEach(function(g){var o=document.createElement("option");o.value=g;dl.appendChild(o)});
  renderTabs(n,names);
  var all=curTab==="*";
  var rows=people.filter(function(p){return curTab==="*"||gname(p)===curTab}).map(function(p){
    return{id:p.id,name:p.name,min:p.min,last:p.last,group:p.group||"",planned:p.planned||0,ack:p.ack||0,diff:n-p.last,st:status(p,n)}})
    .sort(function(a,b){return a.min-b.min||b.last-a.last||a.name.localeCompare(b.name)});
  var cnt={ok:0,late:0,plan:0};rows.forEach(function(r){cnt[r.st]++});$("total").textContent=rows.length?"Totale "+rows.length+" — "+cnt.ok+" In regola · "+cnt.late+" Da vedere · "+cnt.plan+" Programmato":"";
  var list=$("list");list.textContent="";
  if(!rows.length){var e=document.createElement("div");e.className="empty";e.textContent="Nessuna persona qui. Aggiungine una qui sotto.";list.appendChild(e)}
  var prevMin=null;rows.forEach(function(r,idx){if(r.min!==prevMin){prevMin=r.min;var nsub=rows.filter(function(x){return x.min===r.min}).length;var h=document.createElement("div");h.className="sub";h.textContent="Ogni "+(r.min===1?"settimana":r.min+" settimane")+" · "+nsub;list.appendChild(h)}
    var d=document.createElement("div");d.className="row "+r.st;
    var m=document.createElement("span");m.className="min";m.textContent=r.min;
    var nm=document.createElement("span");nm.className="name";nm.textContent=r.name;
    var sm=document.createElement("small");
    sm.textContent=r.st==="plan"?"Programmato settimana "+isoOf(r.planned).w:(r.diff<=0?"vista questa settimana":"da "+r.diff+(r.diff===1?" settimana":" settimane"));
    
    var wk=document.createElement("span");wk.className="wk";wk.textContent=isoOf(r.last).w;
    d.appendChild(m);d.appendChild(nm);
    var f=document.createElement("span");f.className="flag "+(r.st==="late"?"red":(r.st==="plan"?"orange":"green"));f.innerHTML=FLAG;d.appendChild(f);
    d.appendChild(wk);
    if(!r.planned){
      var pb=document.createElement("button");pb.className="planb";pb.textContent="🗓";pb.title="Programma per la prossima settimana";
      pb.onclick=function(ev){ev.stopPropagation();save(cp(r,{planned:n+1}))};
      d.appendChild(pb);
    }
    var b=document.createElement("button");b.className="seen";b.textContent="✓";b.title="Visto questa settimana";
    b.onclick=function(ev){ev.stopPropagation();save(cp(r,{last:nowAbs(),planned:0}))};
    d.appendChild(b);
    d.onclick=function(){openSheet(r)};
    list.appendChild(d);
  });
}

function openSheet(p){
  editing=p?p.id:null;
  $("fName").value=p?p.name:"";$("fMin").value=p?p.min:2;
  $("fWeek").value=isoOf(p?p.last:nowAbs()).w;
  $("fGroup").value=p?p.group:(curTab!=="*"&&curTab!=="Senza gruppo"?curTab:"");["fName","fMin","fWeek","fGroup"].forEach(function(i){$(i).style.borderColor=""});
  $("fPlan").value=p&&p.planned?isoOf(p.planned).w:"";
  $("delBtn").style.display=p?"":"none";
  $("sheet").style.display="block";$("fName").focus();
  $("sheet").scrollIntoView({behavior:"smooth",block:"center"});
}
function closeSheet(){$("sheet").style.display="none";editing=null}

function save(p){
  var i=people.findIndex(function(x){return x.id===p.id});
  if(i>=0)people[i]=p;else people.push(p);
  render();store.set(p);
}
$("addBtn").onclick=function(){openSheet(null)};
$("cancelBtn").onclick=closeSheet;
$("saveBtn").onclick=function(){
  var name=$("fName").value.trim(),min=parseInt($("fMin").value,10),w=parseInt($("fWeek").value,10),pl=parseInt($("fPlan").value,10);
  var g=$("fGroup").value.trim();var okAll=true;function chk(id,c){$(id).style.borderColor=c?"":"var(--bad)";if(!c)okAll=false}chk("fName",!!name);chk("fMin",min>=1);chk("fWeek",w>=1&&w<=53);chk("fGroup",!!g);if(!okAll)return;
  var planned=(pl>=1&&pl<=53)?absFromPlanInput(pl):0;
  
  var ex=people.filter(function(x){return x.id===editing})[0];var ackOld=ex?ex.ack||0:0;
  save({id:editing||("p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)),name:name,min:min,last:absFromWeekInput(w),group:g,planned:planned,ack:ackOld});
  closeSheet();
};
$("delBtn").onclick=function(){
  if(!editing)return;
  var id=editing;people=people.filter(function(x){return x.id!==id});
  render();store.del(id);closeSheet();
};

function localStore(){
  var K="persone-v1";
  try{people=JSON.parse(localStorage.getItem(K)||"[]")}catch(e){people=[]}
  function w(){try{localStorage.setItem(K,JSON.stringify(people))}catch(e){}}
  $("status").textContent="Funziona anche senza internet. Dati salvati solo su questo iPhone.";
  return{set:w,del:w};
}
$("legend").innerHTML='<span><span class="flag green">'+FLAG+'</span> In regola</span><span><span class="flag red">'+FLAG+'</span> Da vedere</span><span><span class="flag orange">'+FLAG+'</span> Programmato</span>';
store=localStore();render();
$("expBtn").onclick=async function(){
  var c=isoOf(nowAbs()),name="persone-backup-"+c.y+"-S"+c.w+".json",txt=JSON.stringify({v:1,people:people});
  try{
    var file=new File([txt],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}
  }catch(e){if(e&&e.name==="AbortError")return}
  try{var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();a.remove()}catch(e){}
};
$("impBtn").onclick=function(){$("impFile").click()};
$("impFile").onchange=function(ev){
  var f=ev.target.files[0];if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var o=JSON.parse(String(rd.result)),arr=o.people||[];
      var ok=arr.filter(function(p){return p&&p.id&&p.name&&p.min>=1&&p.last>0});
      ok.forEach(function(p){save(cp(p,{}))});
      $("msg").textContent=ok.length?"Importate "+ok.length+" persone.":"Nessuna persona trovata nel file.";
    }catch(e){$("msg").textContent="File non valido."}
  };
  rd.readAsText(f);ev.target.value="";
};
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}
setInterval(render,3600000);
document.addEventListener("visibilitychange",function(){if(!document.hidden)render()});
})();
</script>
</body>
</html>
